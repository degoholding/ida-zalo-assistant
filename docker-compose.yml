name: bot-tro-ly

# Một máy chạy đủ: dịch vụ đồng bộ + MySQL. Chuyển sang VPS khác = chép thư mục này + .env + sao lưu DB.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://bot:${MYSQL_PASSWORD}@mysql:3306/bot_tro_ly
      DATA_DIR: /data
      # Trong container nghe mọi giao diện; ra ngoài máy chỉ mở ở 127.0.0.1 (xem ports)
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 512m

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bot_tro_ly
      MYSQL_USER: bot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12
    mem_limit: 768m

volumes:
  mysql-data:
