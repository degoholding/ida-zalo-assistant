name: bot-tro-ly

# Một máy chạy đủ: dịch vụ đồng bộ (app) + tiến trình nền (worker) + MySQL. Chuyển sang VPS khác = chép thư mục này
# + .env + sao lưu DB.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://bot:${MYSQL_PASSWORD}@mysql:3306/bot_tro_ly
      DATA_DIR: /data
      # Trong container nghe mọi giao diện; ra ngoài máy chỉ mở ở 127.0.0.1 (xem ports)
      WEB_HOST: 0.0.0.0
      # Việc nền (dọn quá hạn, ảnh đại diện, hàng đợi) do service worker chạy
      WORKER_EMBEDDED: "false"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 512m

  # Tiến trình nền (src/worker.ts): cùng image với app, không giữ phiên Zalo, không mở cổng
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: mysql://bot:${MYSQL_PASSWORD}@mysql:3306/bot_tro_ly
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # Bản sao lưu do service backup ghi — worker đưa lên R2
      - ./backups:/backups:ro
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  # Sao lưu CSDL hằng ngày từ 02:00 giờ VN vào ./backups (giữ 7 ngày trên đĩa) — scripts/backup-loop.sh. Dùng image
  # mysql:8.4 để mysqldump đúng phiên bản máy chủ.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["sh", "/backup-loop.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: bot_tro_ly
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bot_tro_ly
      MYSQL_USER: bot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Tìm tin (phase 6, migration 023): chỉ mục toàn văn tách theo khoảng trắng, nhận cả từ 1–2 chữ («nợ», «xe»), không bỏ
    # stopword tiếng Anh («la», «a» là chữ tiếng Việt); trần bộ nhớ MỖI câu tìm 32 MB — vượt thì câu tìm báo lỗi (ứng dụng
    # lùi về LIKE) thay vì làm sập MySQL. Đo 09/10/2026 trên 1 triệu tin: MySQL nghỉ ~670 MB, trần 64 MB × 2 câu chữ phổ biến
    # cùng lúc → bị giết; 32 MB thì 6 câu cùng lúc vẫn ~600 MB.
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF",
      "--innodb-ft-min-token-size=1", "--innodb-ft-enable-stopword=OFF", "--innodb-ft-result-cache-limit=33554432"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12
    mem_limit: 768m

volumes:
  mysql-data:
